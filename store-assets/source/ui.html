<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Extension UI</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      // Renders the real popup or settings page with demo data, then exposes a capture for render.html.
      import { toPng } from 'html-to-image';
      import { installChromeStub } from './chrome-stub.js';
      import { allowRenderingWithoutPaint } from './no-paint.js';

      allowRenderingWithoutPaint();
      const params = new URLSearchParams(location.search);
      const page = params.get('page') === 'options' ? 'options' : 'popup';
      await installChromeStub(params);
      await import(page === 'options' ? '/src/options/Options.tsx' : '/src/popup/Popup.tsx');

      const readySelector = page === 'options' ? '.settings-section' : '.primary-button:not([disabled])';
      for (let attempt = 0; attempt < 200 && !document.querySelector(readySelector); attempt += 1) {
        await new Promise((resolve) => setTimeout(resolve, 25));
      }
      await document.fonts.ready;
      await new Promise((resolve) => setTimeout(resolve, 150));

      // Regions let the renderers point callouts at parts of the real UI. They are relative to the captured element.
      const regionSelectors = {
        defaultTarget: '.default-target',
        autoStatus: '.auto-status',
        primary: '.primary-button',
        quick: '.quick-grid',
        quickClaude: '.quick-grid .quick-button:nth-child(2)',
        result: '.result-panel',
        autoToggle: '.settings-section .toggle-row',
        autoToggleInput: '.settings-section .toggle-row input'
      };
      // clip=<selector> captures one element (with transparent corners) instead of the whole page; scale sets the pixel ratio.
      const clip = params.get('clip');
      const pixelRatio = Number(params.get('scale')) || 2;
      window.captureUi = async () => {
        const target = (clip && document.querySelector(clip)) || document.body;
        const box = target === document.body ? { left: 0, top: 0 } : target.getBoundingClientRect();
        const width = target === document.body ? document.body.scrollWidth : Math.ceil(box.width);
        const height = target === document.body ? document.body.scrollHeight : Math.ceil(box.height);
        const regions = {};
        for (const [name, selector] of Object.entries(regionSelectors)) {
          const element = document.querySelector(selector);
          if (element) {
            const rect = element.getBoundingClientRect();
            regions[name] = { x: rect.left - box.left, y: rect.top - box.top, width: rect.width, height: rect.height };
          }
        }
        const src = await toPng(target, {
          pixelRatio,
          width,
          height,
          backgroundColor: target === document.body ? '#f7f8fb' : undefined,
          skipFonts: true
        });
        return { src, width, height, regions };
      };
      window.uiReady = true;
    </script>
  </body>
</html>
